services:
  - type: web
    name: javabank
    runtime: docker
    dockerfilePath: ./Dockerfile
    branch: main
    plan: starter
    healthCheckPath: /api/health

    disk:
      name: javabank-data
      mountPath: /app/data
      sizeGB: 1

    envVars:
      - key: PORT
        value: 8080

      - key: APP_SECRET
        generateValue: true

      - key: ANTHROPIC_API_KEY
        sync: false
